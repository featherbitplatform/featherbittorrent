[package]
name = "featherbittorrent-desktop"
description = "featherbittorrent desktop app: the web UI in a native window, with This computer's engine behind it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
build = "build.rs"

[lints]
workspace = true

[[bin]]
name = "featherbittorrent-desktop"
path = "src/main.rs"

[build-dependencies]
# Reads `tauri.conf.json` and the capabilities, and embeds what `generate_context!` needs.
tauri-build.workspace = true

[dependencies]
# The window, the webview and the commands the page calls.
tauri.workspace = true
# `generate_context!` expands to code that names `serde_json` from the crate that calls it, so it has to
# be a direct dependency (the Tauri spike's finding).
serde_json.workspace = true
# The answers the commands hand the page.
serde.workspace = true
# Where the app's files live, its settings file and the launch secret.
fbtt-desktop-core.workspace = true
# This computer's library: its config and its lock.
fbtt-core.workspace = true
# This computer's engine, served on loopback with the launch secret (`Server::start_desktop`).
fbtt-server.workspace = true
# The engine's own settings type, which `Server::start_desktop` takes beside the config.
fbt.workspace = true
# Saved instance passwords, in the system keychain (`keychain.rs`).
keyring.workspace = true
# Holds a saved password while the shell signs in with it, and overwrites it when done.
zeroize.workspace = true
# The shell's HTTP client for remote instances: the saved-password sign-in and the reachability probe.
# rustls, as `fbtt-core` already asks for it, so https servers need no system TLS stack.
reqwest = { workspace = true, features = ["rustls-tls"] }

# The native message for a library already in use. macOS needs no feature: its alert is the
# platform's own. Windows takes the same common controls v6 the webview's manifest asks for, as
# `tauri-plugin-dialog` does. Everywhere else it is GTK 3, which the webview links anyway.
[target.'cfg(target_os = "macos")'.dependencies]
rfd.workspace = true

[target.'cfg(windows)'.dependencies]
rfd = { workspace = true, features = ["common-controls-v6"] }

[target.'cfg(not(any(windows, target_os = "macos")))'.dependencies]
rfd = { workspace = true, features = ["gtk3"] }

[dev-dependencies]
# `fbtt_core::scratch`: each test runs This computer on a library of its own.
fbtt-core = { workspace = true, features = ["test-support"] }
# The tests' runtime, and the deadline every wait is under.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
# The tests' client: plain http to loopback, so no TLS stack is asked for.
reqwest.workspace = true
