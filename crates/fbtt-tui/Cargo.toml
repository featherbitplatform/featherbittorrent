[package]
name = "fbtt-tui"
description = "featherbittorrent TUI: the model (keys in, actions out) and its ratatui rendering."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# The snapshot types the model speaks, and `fbt::display_safe` for remote text.
fbtt-core.workspace = true
fbt.workspace = true
# crossterm is here for the key events the model takes; it is the same version
# ratatui's backend uses, so one crossterm serves both.
crossterm.workspace = true
ratatui.workspace = true
# The scrolling field in the settings screen measures text in terminal cells.
unicode-width.workspace = true
# The add dialog expands a leading `~/` in a path someone typed, which is the home
# directory this platform says it has.
directories.workspace = true
# What the connect screen holds a password or a key passphrase in: `Zeroizing`, so the bytes are
# overwritten when the screen lets go of them and no copy of them outlives the field.
zeroize.workspace = true
# The connect screen asks a device key file whether it is encrypted before it asks for a passphrase,
# which is `ssh-key`'s question to answer (its own features are named in the workspace table).
ssh-key.workspace = true
# The address question - does this password leave this machine unencrypted? - is answered with `Url::host()`,
# the same reading reqwest dials, so a backslash or a user name spelled into the authority cannot make the
# screen call a remote host loopback.
url.workspace = true
# The logo's image work in `graphics`: `png` decodes the shipped mark and encodes the PNG an iTerm2
# inline payload carries, `color_quant` chooses the 256-colour palette a sixel stream is allowed to
# send, and `base64` spells the bytes both protocols transmit as text.
png.workspace = true
color_quant.workspace = true
base64.workspace = true
