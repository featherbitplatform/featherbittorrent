[package]
name = "featherbittorrent"
description = "BitTorrent client for the terminal: a local TUI, and a headless server it can drive."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The full build: `serve` answers the browser UI on the API's origin beside the API itself, and
# `--version` says `(full)`. Without this feature the binary is the headless one, today's build,
# and says `(headless)`. The feature is off by default so a plain `cargo build -p
# featherbittorrent` stays the headless artifact; the release ships both (plan
# 2026-11-21-web-ui-milestone-1).
web-ui = ["fbtt-server/web-ui"]

[dependencies]
# `string` is for `assets.rs`: it builds a command again from the name and text of one that was already
# built, and those are owned strings rather than `'static` literals.
clap = { workspace = true, features = ["string"] }
# The hidden `generate-assets` subcommand: the man pages (`clap_mangen`) and the shell completions
# (`clap_complete`) the packages install, built from the same `Command` as `--help`. They are in every
# build, release included, because the packaging scripts run the release binary to make them.
clap_complete.workspace = true
clap_mangen.workspace = true
# The library this binary wires terminal, runtime and backend together with.
fbtt-core.workspace = true
fbtt-tui.workspace = true
# `featherbittorrent serve`, and the password hashes and device-key checks the admin commands write
# into config.yaml. No features are asked for: `test-support` adds counters only a test reads, and a
# release binary must not link them. What this crate needs from the server is public in every build -
# including `Server::start_with_settings`, which takes the engine settings as an argument because the
# debug-only `--offline` knob changes them (see `serve.rs`). fbtt-server's own tests get their feature
# from its `[[test]] required-features`, not from anything here.
fbtt-server.workspace = true
# The engine's own settings type, which the debug-only `--offline` knob edits before handing them to
# the server: it is the only way to keep a test run's sockets on loopback without pretending the
# config said so.
fbt.workspace = true
# Reading whether a config file names a `server` section at all, which the parsed `Config` cannot
# answer: every field of it has a default, so a file that never mentioned one still reads back as a
# full server section. See `serve.rs`.
serde_norway.workspace = true
# The wizard's and `user set`'s password prompt.
rpassword.workspace = true
# Where `serve`'s log lines go: stderr, with `RUST_LOG` honoured.
tracing-subscriber.workspace = true
# The log lines themselves (`listening on <addr>`, the stop reason).
tracing.workspace = true
# The TUI stack. `event-stream` is what the loop selects over; ratatui's own backend
# uses the same crossterm version, so one crate drives the terminal.
crossterm.workspace = true
ratatui.workspace = true
# Where a connect password lives between runs (see `secrets.rs`). Only the platform's own store is
# turned on: `v1` names the Apple keychain, the Windows credential manager and the Linux secret
# service, one per platform, all of them reached without a C library this build has to bring itself.
keyring.workspace = true
# What a password read out of the keychain is held in, so it is overwritten when this run is done with
# it - the same wrapper `fbtt-core`'s `Secret` uses.
zeroize.workspace = true
# Spelling the address half of a keychain account name, so `http://host:1` and `http://host:1/` are one
# entry rather than two (see `secrets.rs`). The same parser the connect screen and reqwest already use, so
# this adds no crate to the build.
url.workspace = true
# The `Stream` trait for polling that event stream inside `tokio::select!`.
futures-core.workspace = true
# The runtime: `rt-multi-thread` because the backend task runs long engine steps that
# must not stall the event read; `signal` for SIGTERM and Ctrl-C off Unix.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }

# The logo probe's tty read (see `probe.rs`): `poll` and `read` on stdin, so the bytes answering the queries
# are never held in a buffer crossterm cannot see.
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["std", "stdio", "event"] }

# The logo probe's tty read on Windows: a console's input events are where the terminal's replies arrive,
# one key event per character, so the probe reads the console record by record (see `probe.rs`).
[target.'cfg(windows)'.dependencies]
crossterm_winapi.workspace = true

[dev-dependencies]
# The test process holds `LibraryLock` to make the binary's second acquire lose, and `fbtt_core::scratch`
# gives the pure decisions above a library directory of their own to read.
fbtt-core = { workspace = true, features = ["test-support"] }

# Packages: cargo-deb and cargo-generate-rpm read these two sections (both tools are pinned in
# .github/workflows/release.yml; they are packaging tools, not dependencies of the build). The binary
# links only libc, libm, libgcc_s and the loader, so `depends` is short; dev/check-linux-binary.sh
# refuses a binary that asks for a newer glibc than 2.34 or for any other shared library, which is what
# keeps this list true. No maintainer scripts and no systemd-units: a package never installs, enables or
# starts a service (the design spec's autostart non-goal), so the example units ship as documentation
# under /usr/share/doc instead of under a unit directory. The man pages and completions are the
# `generate-assets` output staged by dev/package-linux.sh; their sources sit under target/release because
# that is the prefix both tools resolve to the build's own target directory, wherever CARGO_TARGET_DIR
# sends it, and the pages arrive already gzipped because Debian policy wants them compressed.
# The two builds ship as two packages that own the same /usr/bin/featherbittorrent. The .deb makes
# each declare that it conflicts with and replaces the other, so installing one removes the first and
# the other way around: full in the base section, headless in the variants.headless section, which
# dev/package-linux.sh selects with --variant headless. (The .rpm has no "replaces" tag and uses
# obsoletes instead; see the generate-rpm section below.) The base section is the full package; the
# headless section is a complete set of its own because cargo-deb merges the variant over the base, so
# the headless section carries the headless name, its conflicts and replaces the other way around, and
# the same assets with the documentation folder renamed to the headless package's name (the binary, the
# man pages and the completions keep the product's own name, which generate-assets writes from the
# binary's command name, the one both packages install). The archive installs nothing, so it carries no
# conflicts of its own.
[package.metadata.deb]
name = "featherbittorrent"
maintainer = "featherbit <featherbit-gw@outlook.com>"
copyright = "featherbit"
license-file = ["../../LICENSE", "0"]
extended-description = """\
featherbittorrent is a BitTorrent client for the terminal, built on fbt-lib. It runs either as a TUI \
that downloads and seeds on the machine in front of you, or headless as a server that the same TUI \
controls over the network."""
section = "net"
priority = "optional"
depends = "libc6 (>= 2.34), libgcc-s1"
assets = [
    ["target/release/featherbittorrent", "usr/bin/", "755"],
    ["target/release/pkg/man/*.1.gz", "usr/share/man/man1/", "644"],
    ["target/release/pkg/completions/featherbittorrent.bash", "usr/share/bash-completion/completions/featherbittorrent", "644"],
    ["target/release/pkg/completions/_featherbittorrent", "usr/share/zsh/vendor-completions/_featherbittorrent", "644"],
    ["target/release/pkg/completions/featherbittorrent.fish", "usr/share/fish/vendor_completions.d/featherbittorrent.fish", "644"],
    ["../../README.md", "usr/share/doc/featherbittorrent/README.md", "644"],
    ["../../NOTICE", "usr/share/doc/featherbittorrent/NOTICE", "644"],
    ["../../docs/autostart.md", "usr/share/doc/featherbittorrent/autostart.md", "644"],
    ["../../docs/server.md", "usr/share/doc/featherbittorrent/server.md", "644"],
    ["../../docs/reverse-proxy.md", "usr/share/doc/featherbittorrent/reverse-proxy.md", "644"],
    ["../../packaging/systemd/system/featherbittorrent.service", "usr/share/doc/featherbittorrent/examples/systemd/system/featherbittorrent.service", "644"],
    ["../../packaging/systemd/user/featherbittorrent.service", "usr/share/doc/featherbittorrent/examples/systemd/user/featherbittorrent.service", "644"],
]
conflicts = "featherbittorrent-headless"
replaces = "featherbittorrent-headless"

[package.metadata.deb.variants.headless]
name = "featherbittorrent-headless"
conflicts = "featherbittorrent"
replaces = "featherbittorrent"
assets = [
    ["target/release/featherbittorrent", "usr/bin/", "755"],
    ["target/release/pkg/man/*.1.gz", "usr/share/man/man1/", "644"],
    ["target/release/pkg/completions/featherbittorrent.bash", "usr/share/bash-completion/completions/featherbittorrent", "644"],
    ["target/release/pkg/completions/_featherbittorrent", "usr/share/zsh/vendor-completions/_featherbittorrent", "644"],
    ["target/release/pkg/completions/featherbittorrent.fish", "usr/share/fish/vendor_completions.d/featherbittorrent.fish", "644"],
    ["../../README.md", "usr/share/doc/featherbittorrent-headless/README.md", "644"],
    ["../../NOTICE", "usr/share/doc/featherbittorrent-headless/NOTICE", "644"],
    ["../../docs/autostart.md", "usr/share/doc/featherbittorrent-headless/autostart.md", "644"],
    ["../../docs/server.md", "usr/share/doc/featherbittorrent-headless/server.md", "644"],
    ["../../docs/reverse-proxy.md", "usr/share/doc/featherbittorrent-headless/reverse-proxy.md", "644"],
    ["../../packaging/systemd/system/featherbittorrent.service", "usr/share/doc/featherbittorrent-headless/examples/systemd/system/featherbittorrent.service", "644"],
    ["../../packaging/systemd/user/featherbittorrent.service", "usr/share/doc/featherbittorrent-headless/examples/systemd/user/featherbittorrent.service", "644"],
]

# Fedora's zsh path is site-functions, not Debian's vendor-completions; RPM puts licenses under
# /usr/share/licenses. `doc = true` marks the documentation files so removal owns them with the package.
# The requirements are cargo-generate-rpm's automatic ones, read from the packaged binary itself:
# dev/package-linux.sh prints `rpm -qpR` and refuses anything the deb `depends` above does not cover
# too. No script keys here either, for the same reason as above. The package owns its files but not the
# directories they sit in: cargo-generate-rpm 0.21.1 cannot emit a `%dir` entry (its `dir = true` asset
# goes through rpm's `with_file`, which refuses a directory), so `dnf remove` leaves the emptied doc and
# license directories behind. That is harmless, and dev/smoke-linux.sh prints a note about it.
# The headless package's name and its obsoletes of the full package live in the variants.headless
# section, which dev/package-linux.sh selects with --variant headless; the base section is the full
# package, and it declares the other way around so installing one over the other removes the first.
# They own the same /usr/bin/featherbittorrent, and RPM has no "replaces" tag: an `obsoletes` entry is
# what makes dnf remove the other package when it installs this one. cargo-generate-rpm reads an
# obsoletes entry as a TOML table whose keys are the package names, so the other package's name is the
# key and the empty string is the version that matches any. As with cargo-deb, the headless section is a
# complete set of its own, carrying the headless name, its obsoletes the other way around, and the same
# assets with the documentation and license folders renamed to the headless package's name. The variant
# wins over the base key by key (cargo-generate-rpm's CompoundMetadataConfig iterates the configs in
# reverse and takes the first that names the key), so the headless section names its own obsoletes and
# does not inherit the base section's, which points the other way.
[package.metadata.generate-rpm]
name = "featherbittorrent"
summary = "BitTorrent client for the terminal, with a headless server"
url = "https://github.com/featherbitplatform/featherbittorrent"
assets = [
    { source = "target/release/featherbittorrent", dest = "/usr/bin/featherbittorrent", mode = "755" },
    { source = "target/release/pkg/man/*.1.gz", dest = "/usr/share/man/man1/", mode = "644" },
    { source = "target/release/pkg/completions/featherbittorrent.bash", dest = "/usr/share/bash-completion/completions/featherbittorrent", mode = "644" },
    { source = "target/release/pkg/completions/_featherbittorrent", dest = "/usr/share/zsh/site-functions/_featherbittorrent", mode = "644" },
    { source = "target/release/pkg/completions/featherbittorrent.fish", dest = "/usr/share/fish/vendor_completions.d/featherbittorrent.fish", mode = "644" },
    { source = "../../README.md", dest = "/usr/share/doc/featherbittorrent/README.md", mode = "644", doc = true },
    { source = "../../docs/autostart.md", dest = "/usr/share/doc/featherbittorrent/autostart.md", mode = "644", doc = true },
    { source = "../../docs/server.md", dest = "/usr/share/doc/featherbittorrent/server.md", mode = "644", doc = true },
    { source = "../../docs/reverse-proxy.md", dest = "/usr/share/doc/featherbittorrent/reverse-proxy.md", mode = "644", doc = true },
    { source = "../../LICENSE", dest = "/usr/share/licenses/featherbittorrent/LICENSE", mode = "644", doc = true },
    { source = "../../NOTICE", dest = "/usr/share/licenses/featherbittorrent/NOTICE", mode = "644", doc = true },
    { source = "../../packaging/systemd/system/featherbittorrent.service", dest = "/usr/share/doc/featherbittorrent/examples/systemd/system/featherbittorrent.service", mode = "644", doc = true },
    { source = "../../packaging/systemd/user/featherbittorrent.service", dest = "/usr/share/doc/featherbittorrent/examples/systemd/user/featherbittorrent.service", mode = "644", doc = true },
]

[package.metadata.generate-rpm.obsoletes]
"featherbittorrent-headless" = ""

[package.metadata.generate-rpm.variants.headless]
name = "featherbittorrent-headless"
assets = [
    { source = "target/release/featherbittorrent", dest = "/usr/bin/featherbittorrent", mode = "755" },
    { source = "target/release/pkg/man/*.1.gz", dest = "/usr/share/man/man1/", mode = "644" },
    { source = "target/release/pkg/completions/featherbittorrent.bash", dest = "/usr/share/bash-completion/completions/featherbittorrent", mode = "644" },
    { source = "target/release/pkg/completions/_featherbittorrent", dest = "/usr/share/zsh/site-functions/_featherbittorrent", mode = "644" },
    { source = "target/release/pkg/completions/featherbittorrent.fish", dest = "/usr/share/fish/vendor_completions.d/featherbittorrent.fish", mode = "644" },
    { source = "../../README.md", dest = "/usr/share/doc/featherbittorrent-headless/README.md", mode = "644", doc = true },
    { source = "../../docs/autostart.md", dest = "/usr/share/doc/featherbittorrent-headless/autostart.md", mode = "644", doc = true },
    { source = "../../docs/server.md", dest = "/usr/share/doc/featherbittorrent-headless/server.md", mode = "644", doc = true },
    { source = "../../docs/reverse-proxy.md", dest = "/usr/share/doc/featherbittorrent-headless/reverse-proxy.md", mode = "644", doc = true },
    { source = "../../LICENSE", dest = "/usr/share/licenses/featherbittorrent-headless/LICENSE", mode = "644", doc = true },
    { source = "../../NOTICE", dest = "/usr/share/licenses/featherbittorrent-headless/NOTICE", mode = "644", doc = true },
    { source = "../../packaging/systemd/system/featherbittorrent.service", dest = "/usr/share/doc/featherbittorrent-headless/examples/systemd/system/featherbittorrent.service", mode = "644", doc = true },
    { source = "../../packaging/systemd/user/featherbittorrent.service", dest = "/usr/share/doc/featherbittorrent-headless/examples/systemd/user/featherbittorrent.service", mode = "644", doc = true },
]

[package.metadata.generate-rpm.variants.headless.obsoletes]
"featherbittorrent" = ""
