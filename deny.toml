[licenses]
# The list below is the featherbit allow list, shared with fbt-lib and the
# gateway. Entries whose crates arrive with a later task (fbt's rustls chain,
# clipboard and error-code crates) stay in place instead of being re-added then.
unused-allowed-license = "allow"
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "OFL-1.1",
    # Permitted for general-purpose transitive dependencies (error-code, clipboard-style crates)
    "BSL-1.0",
    # Public-domain dedications used by small utility crates
    "CC0-1.0",
    # webpki-roots (Mozilla's root certificates as data, for HTTPS over rustls)
    "CDLA-Permissive-2.0",
]

[advisories]
version = 2
# Unmaintained notices only for crates we depend on directly; transitive ones are outside our
# control. Vulnerabilities still fail at any depth.
unmaintained = "workspace"
ignore = [
    # Both come in through `ssh-agent-lib` 0.6, which pins `ssh-key` 0.6 and is the only thing in this
    # tree that speaks the ssh-agent protocol (`LoginMethod::Agent`). For a server login neither notice
    # describes work this product asks of them: the only device key a featherbittorrent server accepts is
    # Ed25519 (`fbtt_server::auth::keys`), so no RSA private key is ever unlocked and no ECDSA arithmetic
    # runs on the way in. The gateway login is the exception worth saying out loud rather than glossing:
    # an ECDSA P-256 device key signs this client's `private_key_jwt` assertion here (`ES256`, see
    # `fbtt_core::remote::device`), so `crypto-bigint`'s arithmetic does run on a secret value. The fixes
    # are `rsa` 0.10 and `crypto-bigint` 0.7.6 - releases the pinned `ssh-key` cannot take - so this
    # records an upstream release we are waiting on, with each crate's exposure named on its own line.
    "RUSTSEC-2023-0071", # `rsa`: nothing here unlocks or signs with an RSA key, so no affected operation runs.
    # What runs is a P-256 signature over a challenge this client just made, on the machine that owns the
    # key. The secret leaking out is the user's own device key, to somebody who can time this process to
    # the limb - which on the same machine is somebody who can read the key file anyway - so this is the
    # part of the notice this product does not act on. Revisit it when `ssh-key` can take 0.7.6.
    "RUSTSEC-2026-0387", # `crypto-bigint`: ES256 gateway logins sign with a P-256 key on this machine.
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# fbt and fbt-api come from fbt-lib as git dependencies pinned by tag, so a branch or an
# unpinned rev is refused.
required-git-spec = "tag"
# The org allowance below is written before the dependency that uses it arrives, so an
# unused entry is expected, not a problem.
unused-allowed-org = "allow"

# The only git host we take code from: our own org.
[sources.allow-org]
github = ["featherbitplatform"]
