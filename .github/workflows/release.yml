name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - dev/release-version.sh
      - dev/test-release-version.sh
      # The packaging and smoke scripts, their fixtures and the service examples they ship: a pull request
      # touching any of them runs every build and smoke job below, without a tag.
      - dev/package-*.sh
      - dev/package-*.ps1
      - dev/smoke-*.sh
      - dev/smoke-*.ps1
      - dev/check-linux-binary.sh
      - dev/test-packaging.sh
      - dev/test-service-examples.sh
      - dev/fixtures/**
      - packaging/**
      - crates/featherbittorrent/Cargo.toml
      # The desktop app's bundle: its config (identifier, schemes, associations, the .msi's UpgradeCode),
      # its manifest and its icons are what the desktop jobs below package and smoke.
      - crates/featherbittorrent-desktop/Cargo.toml
      - crates/featherbittorrent-desktop/tauri*.conf.json
      - crates/featherbittorrent-desktop/icons/**
      - web/**
      - Dockerfile
      - .github/workflows/release.yml
  workflow_dispatch:

# Read-only by default; only the publish job (tag pushes) gets write access.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # A tag must be v<workspace version>; the resolver and the changelog extraction are tested
  # with fake refs and files (pull requests cannot try a real tag). Every packaging job
  # resolves the version again as its first build-adjacent step, so a wrong tag stops that
  # job before any compile; this job is what makes the failure show up fast on pull requests.
  # The packaging decision tests run here too: they build nothing and install nothing, so the
  # glibc floor, the version mapping deb and rpm need and the argument refusals fail in the
  # cheapest job of the workflow instead of halfway through a compile.
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolver tests
        run: bash dev/test-release-version.sh
      - name: Packaging tests
        run: bash dev/test-packaging.sh
      - name: Resolve version
        id: version
        run: bash dev/release-version.sh

  # CycloneDX SBOM of the workspace's crates (Cargo.lock). Same generator, pin and naming as
  # fbt-lib's release workflow, so one toolchain reviews every release artifact of the platform.
  sbom:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned, so a release SBOM never changes format with an unreviewed syft release.
      - name: Install syft
        id: syft
        uses: anchore/sbom-action/download-syft@v0
        with:
          syft-version: v1.54.1
      - name: Generate the SBOM
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p target/dist
          "$SYFT" scan file:Cargo.lock \
            --source-name featherbittorrent --source-version "$VERSION" \
            -o "cyclonedx-json=target/dist/featherbittorrent-$VERSION.cdx.json"
          # An SBOM without components means syft read nothing from the lockfile.
          jq -e '.components | length > 0' "target/dist/featherbittorrent-$VERSION.cdx.json" > /dev/null \
            || { echo "::error::no components in the SBOM"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: featherbittorrent-sbom
          if-no-files-found: error
          path: target/dist/featherbittorrent-${{ needs.verify.outputs.version }}.cdx.json

  # The Linux packages and archives are built inside an almalinux:9 container on native runners of each
  # arch. Its glibc (2.34, RHEL 9's) is the oldest of the supported systems, so one binary serves the .deb,
  # the .rpm and the .tar.gz from Ubuntu 22.04 and RHEL 9 up to Debian 13 and Raspberry Pi OS 13: an
  # ubuntu-24.04 runner's own glibc (2.39) would be too new for the oldest of them, and
  # dev/check-linux-binary.sh refuses a binary that asks for a newer symbol than that floor. The rustup
  # toolchain installs into the job. gcc, make and pkgconf are what ring's C build needs; rpm, cpio and
  # findutils are what cargo-generate-rpm and the .rpm checks shell out to, and binutils provides the ar
  # the .deb is read with. The variant axis is the two builds every release ships: full turns on the
  # web-ui cargo feature and embeds the built web UI, headless is the build without it. The full variant
  # builds the front end first, because build.rs reads web/dist and refuses to compile the server crate
  # without the built page in it.
  linux:
    name: linux-${{ matrix.variant }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        variant: [full, headless]
        arch: [x86_64, aarch64]
        # arch is a real axis; an include that matches an existing combination only adds keys, whereas
        # includes that set arch themselves overwrite each other and drop one architecture.
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - arch: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    container: almalinux:9
    defaults:
      run:
        shell: bash
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Install build tools
        run: dnf install -y gcc make pkgconf-pkg-config git tar gzip gawk binutils rpm cpio findutils
      - uses: actions/checkout@v4
      # First, so a tag that is not v<workspace version> stops the job before any build.
      - name: Resolve version
        id: version
        run: bash dev/release-version.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-${{ matrix.variant }}-${{ matrix.arch }}
      # The full build embeds web/dist; the headless build does not, and the npm setup below would be
      # wasted work for it, so it runs only when the variant is full. The node action is pinned to the
      # same node-version as ci.yml, and the cache key follows web/package-lock.json, so a front end
      # change rebuilds the front end in every job that needs one.
      - if: matrix.variant == 'full'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - if: matrix.variant == 'full'
        name: Front end
        run: npm --prefix web ci && npm --prefix web run build
      # Pinned, and installed from the tool's own lockfile, so a release does not change because a
      # dependency of the packaging tool gained a version. The same pins ../terminal releases with.
      - name: Install packaging tools
        run: cargo install --locked cargo-deb@3.8.0 cargo-generate-rpm@0.21.1
      # Builds, packages as .deb, .rpm and .tar.gz, holds the binary to the glibc floor and the NEEDED
      # allow list, and proves that no package carries a maintainer script or a file a service manager
      # would pick up. It prints the paths it wrote, and each one beside its own .sha256. The variant is
      # the last argument, which is what dev/test-packaging.sh exercises against the unknown-variant
      # refusal (exit 2).
      - name: Package
        run: bash dev/package-linux.sh "${{ steps.version.outputs.version }}" "${{ matrix.arch }}" "${{ matrix.variant }}"
      - uses: actions/upload-artifact@v4
        with:
          # The artifact name must be distinct per variant, and the headless variant's name carries
          # -headless after featherbittorrent, which is what the headless archive's own name spells out.
          name: featherbittorrent-${{ matrix.variant }}-linux-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            target/dist/featherbittorrent-${{ matrix.variant == 'headless' && 'headless-' || '' }}${{ steps.version.outputs.version }}-linux-${{ matrix.arch }}.deb
            target/dist/featherbittorrent-${{ matrix.variant == 'headless' && 'headless-' || '' }}${{ steps.version.outputs.version }}-linux-${{ matrix.arch }}.deb.sha256
            target/dist/featherbittorrent-${{ matrix.variant == 'headless' && 'headless-' || '' }}${{ steps.version.outputs.version }}-linux-${{ matrix.arch }}.rpm
            target/dist/featherbittorrent-${{ matrix.variant == 'headless' && 'headless-' || '' }}${{ steps.version.outputs.version }}-linux-${{ matrix.arch }}.rpm.sha256
            target/dist/featherbittorrent-${{ matrix.variant == 'headless' && 'headless-' || '' }}${{ steps.version.outputs.version }}-${{ matrix.target }}.tar.gz
            target/dist/featherbittorrent-${{ matrix.variant == 'headless' && 'headless-' || '' }}${{ steps.version.outputs.version }}-${{ matrix.target }}.tar.gz.sha256

  # Every Linux artifact is installed, run and removed in a clean container of the system it claims to
  # serve, before anything is published: debian:12 and debian:13 stand in for Raspberry Pi OS 12 and 13
  # (same userland; Raspberry Pi publishes no container image), ubuntu:22.04 is the oldest .deb glibc,
  # fedora:41 and rockylinux:9 are the .rpm systems, and ubuntu:22.04 again puts the .tar.gz through the
  # same CLI smoke. fail-fast is off so one sick image cannot hide the state of the others, and the runner
  # follows the architecture so each package runs natively: a container image is not emulated here. The
  # variant axis is what the artifact was built from: the smoke looks for the variant's package name and
  # the variant's archive name, and the CLI smoke checks that the binary's own version string names that
  # variant, so an artifact holding the other variant's binary fails here rather than at install time.
  linux-smoke:
    name: linux smoke ${{ matrix.variant }} ${{ matrix.arch }} ${{ matrix.target.format }} ${{ matrix.target.image }}
    needs: linux
    strategy:
      fail-fast: false
      matrix:
        variant: [full, headless]
        arch: [x86_64, aarch64]
        target:
          - { image: "debian:12", format: deb }
          - { image: "debian:13", format: deb }
          - { image: "ubuntu:22.04", format: deb }
          - { image: "fedora:41", format: rpm }
          - { image: "rockylinux:9", format: rpm }
          - { image: "ubuntu:22.04", format: tar.gz }
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    container: ${{ matrix.target.image }}
    defaults:
      run:
        shell: bash
    steps:
      # Only the two scripts this smoke runs. A minimal image carries no git, in which case checkout falls
      # back to downloading the repository archive, which is enough for two files and needs no toolchain.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            dev/smoke-linux.sh
            dev/smoke-cli.sh
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          name: featherbittorrent-${{ matrix.variant }}-linux-${{ matrix.arch }}
          path: dist
      # Checksum, minimal install, where the files landed, nothing installed or enabled a service, the CLI
      # smoke, then removal with the user's config left behind. One line per check on stdout. The variant
      # is the last argument, and the smoke's own version check is the exact one: the binary's version
      # string has to name the build this smoke is running against.
      - name: Install, run and remove
        run: bash dev/smoke-linux.sh "${{ matrix.target.format }}" dist "${{ needs.linux.outputs.version }}" "${{ matrix.variant }}"

  # One universal archive from both Apple-silicon and Intel builds. dev/package-macos.sh joins the slices
  # with lipo, checks which architectures are really in the result and whether its signature verifies,
  # generates the man pages and completions from the joined binary, ships the docs and the launchd example
  # as files only, and finishes with dev/smoke-cli.sh against a fresh extraction. The runner is Apple
  # silicon, so that smoke runs the arm64 slice; the x86_64 slice is checked by lipo -archs in the script
  # and by the Intel machine that downloads it. The variant axis is what the archive holds: full turns on
  # the web-ui feature (and builds the front end first, because build.rs reads web/dist), headless is the
  # build without it.
  macos:
    name: macos-${{ matrix.variant }}-universal
    strategy:
      fail-fast: false
      matrix:
        variant: [full, headless]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # First, so a tag that is not v<workspace version> stops the job before any build.
      - name: Resolve version
        id: version
        run: bash dev/release-version.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-${{ matrix.variant }}-universal
      # The front end, in full builds only: headless embeds nothing, so the npm setup would be wasted.
      - if: matrix.variant == 'full'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - if: matrix.variant == 'full'
        name: Front end
        run: npm --prefix web ci && npm --prefix web run build
      # The script is its own smoke, so there is nothing left to check between it and the upload. The
      # variant is the second argument, which is what the script's own argument checks exercise.
      - name: Package and smoke
        run: bash dev/package-macos.sh "${{ steps.version.outputs.version }}" "${{ matrix.variant }}"
      - uses: actions/upload-artifact@v4
        with:
          # The artifact name is distinct per variant, and the headless archive's own name carries
          # -headless after featherbittorrent, which is what the upload's file list spells out.
          name: featherbittorrent-${{ matrix.variant }}-macos-universal
          if-no-files-found: error
          path: |
            target/dist/featherbittorrent-${{ matrix.variant == 'headless' && 'headless-' || '' }}${{ steps.version.outputs.version }}-universal-apple-darwin.tar.gz
            target/dist/featherbittorrent-${{ matrix.variant == 'headless' && 'headless-' || '' }}${{ steps.version.outputs.version }}-universal-apple-darwin.tar.gz.sha256

  # The Windows archives build for the runner's own arch on native runners of each arch. -Target is named
  # on the cargo command line (see dev/package-windows.ps1), which is why this step installs that target:
  # under an x64 pwsh emulated on the ARM runner, the architecture the machine reports is not something a
  # build default can be trusted to turn into the right binary. The script zips, hashes and then smokes its
  # own archive through dev/smoke-cli.ps1, so nothing else here runs the exe. The variant axis is what the
  # zip holds: full turns on the web-ui feature (and builds the front end first, because build.rs reads
  # web/dist), headless is the build without it.
  windows:
    name: windows-${{ matrix.variant }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        variant: [full, headless]
        arch: [x86_64, aarch64]
        # arch is a real axis; an include that matches an existing combination only adds keys, whereas
        # includes that set arch themselves overwrite each other and drop one architecture.
        include:
          - arch: x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - arch: aarch64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      # First, so a tag that is not v<workspace version> stops the job before any build.
      - name: Resolve version
        id: version
        shell: bash
        run: bash dev/release-version.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-${{ matrix.variant }}-${{ matrix.arch }}
      # The front end, in full builds only: headless embeds nothing, so the npm setup would be wasted.
      - if: matrix.variant == 'full'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - if: matrix.variant == 'full'
        name: Front end
        run: npm --prefix web ci && npm --prefix web run build
      - name: Package and smoke the zip
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TARGET: ${{ matrix.target }}
          VARIANT: ${{ matrix.variant }}
        run: ./dev/package-windows.ps1 -Version $env:VERSION -Target $env:TARGET -Variant $env:VARIANT
      - uses: actions/upload-artifact@v4
        with:
          # The artifact name is distinct per variant, and the headless zip's own folder name carries
          # -headless after featherbittorrent, which is what the upload's file list spells out.
          name: featherbittorrent-${{ matrix.variant }}-windows-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            target/dist/featherbittorrent-${{ matrix.variant == 'headless' && 'headless-' || '' }}${{ steps.version.outputs.version }}-${{ matrix.target }}.zip
            target/dist/featherbittorrent-${{ matrix.variant == 'headless' && 'headless-' || '' }}${{ steps.version.outputs.version }}-${{ matrix.target }}.zip.sha256

  # The desktop app (crates/featherbittorrent-desktop) as a universal .dmg. tauri-cli is pinned at 2.12.6 and
  # installed from its own lockfile; dev/package-desktop-macos.sh refuses any other version. The bundler
  # builds both Apple architectures and joins them, and the script finishes with
  # dev/smoke-desktop-macos.sh on the image it wrote: the .sha256, the mounted image, the app's Info.plist
  # (identifier, magnet scheme, .torrent document type), both slices, the SDK, the ad-hoc signature and
  # `--version`. The runner is Apple silicon, so the arm64 slice is the one that runs. In CI the bundler's
  # own .dmg is the artifact: the script's local hdiutil fallback never runs here.
  desktop-macos:
    name: desktop macos universal dmg
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # First, so a tag that is not v<workspace version> stops the job before any build.
      - name: Resolve version
        id: version
        run: bash dev/release-version.sh
      # macOS draws the current window design (its corner radius among it) only for an app built against
      # the macOS 26 SDK or newer: use the newest Xcode 26+ on the runner, and fail rather than ship the old
      # look. dev/smoke-desktop-macos.sh checks the binary too. The same step as ../terminal's release.
      - name: Select Xcode 26 or newer
        run: |
          xcode=$(for app in /Applications/Xcode_*.app; do v="${app#/Applications/Xcode_}"; echo "${v%.app}"; done \
            | grep -E '^[0-9]+(\.[0-9]+)*$' \
            | awk -F. '$1 >= 26' | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)
          [[ -n "$xcode" ]] || { echo "::error::no Xcode 26 or newer on this runner"; printf '%s\n' /Applications/Xcode*.app; exit 1; }
          sudo xcode-select -s "/Applications/Xcode_$xcode.app"
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-macos-universal
      # The desktop window shows the web UI, and tauri.conf.json names web/dist as its frontendDist.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Front end
        run: npm --prefix web ci && npm --prefix web run build
      - name: Install tauri-cli
        run: cargo install --locked tauri-cli@2.12.6
      - name: Package and smoke
        run: bash dev/package-desktop-macos.sh "${{ steps.version.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: featherbittorrent-desktop-macos-universal
          if-no-files-found: error
          path: |
            target/dist/featherbittorrent-desktop-${{ steps.version.outputs.version }}-macos-universal.dmg
            target/dist/featherbittorrent-desktop-${{ steps.version.outputs.version }}-macos-universal.dmg.sha256

  # The desktop app's .msi for x86_64. tauri-cli 2.12.6 is pinned, and with it the WiX Toolset its bundler
  # drives: 3.14.1, fetched by the bundler and checked against the SHA-256 it carries, not the runner's own
  # (dev/package-desktop-windows.ps1 says more). The UpgradeCode is fixed in tauri.conf.json and the script
  # refuses a build whose code changed. The .msi is smoked on a fresh runner by desktop-windows-smoke.
  desktop-windows:
    name: desktop windows x86_64 msi
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      # First, so a tag that is not v<workspace version> stops the job before any build.
      - name: Resolve version
        id: version
        shell: bash
        run: bash dev/release-version.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-windows-x86_64
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Front end
        run: npm --prefix web ci && npm --prefix web run build
      - name: Install tauri-cli
        run: cargo install --locked tauri-cli@2.12.6
      - name: Package
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./dev/package-desktop-windows.ps1 -Version $env:VERSION
      - uses: actions/upload-artifact@v4
        with:
          name: featherbittorrent-desktop-windows-x86_64
          if-no-files-found: error
          path: |
            target/dist/featherbittorrent-desktop-${{ steps.version.outputs.version }}-windows-x86_64.msi
            target/dist/featherbittorrent-desktop-${{ steps.version.outputs.version }}-windows-x86_64.msi.sha256

  # A quiet per-machine install of the .msi on a runner that never built it, the magnet protocol and the
  # .torrent association it registers, `--version` through a pipe (the release exe is a GUI program),
  # nothing set to start at boot or login, and an uninstall that keeps the user's settings file.
  desktop-windows-smoke:
    name: desktop windows smoke x86_64 msi
    needs: desktop-windows
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: dev/smoke-desktop-windows.ps1
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          name: featherbittorrent-desktop-windows-x86_64
          path: dist
      - name: Install, run and remove
        env:
          VERSION: ${{ needs.desktop-windows.outputs.version }}
        run: ./dev/smoke-desktop-windows.ps1 dist $env:VERSION

  # The desktop app's Linux .deb, .rpm and .tar.gz, built inside ubuntu:22.04 on native runners of each
  # arch. Unlike the CLI, the desktop binary links the distribution's webview stack (webkit2gtk 4.1, GTK 3,
  # GLib, libsoup 3), and Ubuntu 22.04 is the oldest system that has it, so its glibc (2.35) is the desktop
  # floor; dev/package-desktop-linux.sh holds the binary to it with dev/check-linux-binary.sh --desktop and
  # runs check_no_service on every artifact. The -dev packages are what the build links; rpm, rpm2cpio,
  # cpio and binutils are what the script reads the packages back with.
  desktop-linux:
    name: desktop linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: ubuntu:22.04
    defaults:
      run:
        shell: bash
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Install build tools and the webview libraries
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            ca-certificates curl git build-essential pkg-config file binutils cpio rpm rpm2cpio xz-utils \
            libssl-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/checkout@v4
      # First, so a tag that is not v<workspace version> stops the job before any build.
      - name: Resolve version
        id: version
        run: bash dev/release-version.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-linux-${{ matrix.arch }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Front end
        run: npm --prefix web ci && npm --prefix web run build
      - name: Install tauri-cli
        run: cargo install --locked tauri-cli@2.12.6
      - name: Package
        run: bash dev/package-desktop-linux.sh "${{ steps.version.outputs.version }}" "${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: featherbittorrent-desktop-linux-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            target/dist/featherbittorrent-desktop-${{ steps.version.outputs.version }}-linux-${{ matrix.arch }}.deb
            target/dist/featherbittorrent-desktop-${{ steps.version.outputs.version }}-linux-${{ matrix.arch }}.deb.sha256
            target/dist/featherbittorrent-desktop-${{ steps.version.outputs.version }}-linux-${{ matrix.arch }}.rpm
            target/dist/featherbittorrent-desktop-${{ steps.version.outputs.version }}-linux-${{ matrix.arch }}.rpm.sha256
            target/dist/featherbittorrent-desktop-${{ steps.version.outputs.version }}-linux-${{ matrix.arch }}.tar.gz
            target/dist/featherbittorrent-desktop-${{ steps.version.outputs.version }}-linux-${{ matrix.arch }}.tar.gz.sha256

  # Every desktop Linux artifact installed in a clean container of a system it claims to serve:
  # ubuntu:22.04 (the floor) and debian:12 for the .deb, fedora:41 for the .rpm, ubuntu:22.04 for the
  # .tar.gz. dev/smoke-desktop-linux.sh checks the .sha256, installs with no recommends or weak deps (an
  # unsatisfiable Depends or Requires fails here), runs `--version` under xvfb-run, checks the .desktop
  # file declares x-scheme-handler/magnet and application/x-bittorrent and that nothing starts at boot or
  # login, removes the package and asserts the settings the app wrote survived. Native runner per arch.
  desktop-linux-smoke:
    name: desktop linux smoke ${{ matrix.arch }} ${{ matrix.target.format }} ${{ matrix.target.image }}
    needs: desktop-linux
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        target:
          - { image: "ubuntu:22.04", format: deb }
          - { image: "debian:12", format: deb }
          - { image: "fedora:41", format: rpm }
          - { image: "ubuntu:22.04", format: tar.gz }
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    container: ${{ matrix.target.image }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: dev/smoke-desktop-linux.sh
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          name: featherbittorrent-desktop-linux-${{ matrix.arch }}
          path: dist
      - name: Install, run and remove
        run: bash dev/smoke-desktop-linux.sh "${{ matrix.target.format }}" dist "${{ needs.desktop-linux.outputs.version }}"

  # One release with every system's packages and archives plus the SBOM, published only when every job
  # passed: any failing build or smoke test skips this one, so nothing untested is published, the desktop
  # app's jobs included. Only a tag push publishes; a pull request or manual run builds and checks, never
  # releases. The release is made as a draft, gets all 53 files, and only then is published, so a failed
  # upload never leaves a half-published release; a re-run first removes the draft a failed run left.
  publish:
    name: publish release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - verify
      - sbom
      - linux
      - linux-smoke
      - macos
      - windows
      - desktop-macos
      - desktop-windows
      - desktop-windows-smoke
      - desktop-linux
      - desktop-linux-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      # Put below the version's CHANGELOG.md section and above the generated notes.
      NOTES: >-
        `.deb` for Debian, Ubuntu and Raspberry Pi OS 64-bit (12 or newer), `.rpm` for Fedora and the RHEL 9
        family, and `.tar.gz` for any other Linux with glibc 2.34 or newer, each built for x86_64 and for
        aarch64; macOS gets one universal `.tar.gz` per variant, Windows a `.zip` for x86_64 and one for
        arm64. Every variant ships in two builds: the full build, `featherbittorrent`, carries the web UI
        and is the one to install for a server that serves the browser; the headless build,
        `featherbittorrent-headless`, carries no front end and is the one to install for a server that the
        TUI alone drives. A `.sha256` sits beside every file, so `sha256sum -c` checks what was downloaded.
        No package installs, enables or starts a service; `docs/autostart.md` shows how to run `serve`
        under systemd, launchd or Windows Task Scheduler, and `docs/web-ui.md` covers the full build's
        browser sign-in and the off switch. `featherbittorrent-${{ needs.verify.outputs.version }}.cdx.json`
        is this release's CycloneDX SBOM. The desktop app, `featherbittorrent-desktop`, installs beside either
        build: a universal `.dmg` for macOS 11 or newer, an `.msi` for Windows x86_64, and `.deb`, `.rpm` and
        `.tar.gz` for Linux with glibc 2.35 or newer (Ubuntu 22.04, Debian 12, Fedora 41 and later), each for
        x86_64 and aarch64. Like the CLI it starts nothing at boot or login, and removing it keeps your
        settings and library.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: featherbittorrent-*
          merge-multiple: true
          path: dist
      - name: Release notes from the changelog
        # The version's section of CHANGELOG.md (its lines after the heading, trimmed), then
        # the downloads paragraph; the generated notes follow.
        run: |
          set -euo pipefail
          bash dev/release-version.sh --notes > "$RUNNER_TEMP/notes.md"
          printf '\n%s\n' "$NOTES" >> "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
      - name: Check every file is here
        run: |
          set -euo pipefail
          ls -l dist
          cat > "$RUNNER_TEMP/release-files" <<EOF
          dist/featherbittorrent-$VERSION-linux-x86_64.deb
          dist/featherbittorrent-$VERSION-linux-x86_64.deb.sha256
          dist/featherbittorrent-$VERSION-linux-x86_64.rpm
          dist/featherbittorrent-$VERSION-linux-x86_64.rpm.sha256
          dist/featherbittorrent-$VERSION-x86_64-unknown-linux-gnu.tar.gz
          dist/featherbittorrent-$VERSION-x86_64-unknown-linux-gnu.tar.gz.sha256
          dist/featherbittorrent-headless-$VERSION-linux-x86_64.deb
          dist/featherbittorrent-headless-$VERSION-linux-x86_64.deb.sha256
          dist/featherbittorrent-headless-$VERSION-linux-x86_64.rpm
          dist/featherbittorrent-headless-$VERSION-linux-x86_64.rpm.sha256
          dist/featherbittorrent-headless-$VERSION-x86_64-unknown-linux-gnu.tar.gz
          dist/featherbittorrent-headless-$VERSION-x86_64-unknown-linux-gnu.tar.gz.sha256
          dist/featherbittorrent-$VERSION-universal-apple-darwin.tar.gz
          dist/featherbittorrent-$VERSION-universal-apple-darwin.tar.gz.sha256
          dist/featherbittorrent-headless-$VERSION-universal-apple-darwin.tar.gz
          dist/featherbittorrent-headless-$VERSION-universal-apple-darwin.tar.gz.sha256
          dist/featherbittorrent-$VERSION-x86_64-pc-windows-msvc.zip
          dist/featherbittorrent-$VERSION-x86_64-pc-windows-msvc.zip.sha256
          dist/featherbittorrent-headless-$VERSION-x86_64-pc-windows-msvc.zip
          dist/featherbittorrent-headless-$VERSION-x86_64-pc-windows-msvc.zip.sha256
          dist/featherbittorrent-$VERSION-linux-aarch64.deb
          dist/featherbittorrent-$VERSION-linux-aarch64.deb.sha256
          dist/featherbittorrent-$VERSION-linux-aarch64.rpm
          dist/featherbittorrent-$VERSION-linux-aarch64.rpm.sha256
          dist/featherbittorrent-$VERSION-aarch64-unknown-linux-gnu.tar.gz
          dist/featherbittorrent-$VERSION-aarch64-unknown-linux-gnu.tar.gz.sha256
          dist/featherbittorrent-headless-$VERSION-linux-aarch64.deb
          dist/featherbittorrent-headless-$VERSION-linux-aarch64.deb.sha256
          dist/featherbittorrent-headless-$VERSION-linux-aarch64.rpm
          dist/featherbittorrent-headless-$VERSION-linux-aarch64.rpm.sha256
          dist/featherbittorrent-headless-$VERSION-aarch64-unknown-linux-gnu.tar.gz
          dist/featherbittorrent-headless-$VERSION-aarch64-unknown-linux-gnu.tar.gz.sha256
          dist/featherbittorrent-$VERSION-aarch64-pc-windows-msvc.zip
          dist/featherbittorrent-$VERSION-aarch64-pc-windows-msvc.zip.sha256
          dist/featherbittorrent-headless-$VERSION-aarch64-pc-windows-msvc.zip
          dist/featherbittorrent-headless-$VERSION-aarch64-pc-windows-msvc.zip.sha256
          dist/featherbittorrent-$VERSION.cdx.json
          dist/featherbittorrent-desktop-$VERSION-macos-universal.dmg
          dist/featherbittorrent-desktop-$VERSION-macos-universal.dmg.sha256
          dist/featherbittorrent-desktop-$VERSION-windows-x86_64.msi
          dist/featherbittorrent-desktop-$VERSION-windows-x86_64.msi.sha256
          dist/featherbittorrent-desktop-$VERSION-linux-x86_64.deb
          dist/featherbittorrent-desktop-$VERSION-linux-x86_64.deb.sha256
          dist/featherbittorrent-desktop-$VERSION-linux-x86_64.rpm
          dist/featherbittorrent-desktop-$VERSION-linux-x86_64.rpm.sha256
          dist/featherbittorrent-desktop-$VERSION-linux-x86_64.tar.gz
          dist/featherbittorrent-desktop-$VERSION-linux-x86_64.tar.gz.sha256
          dist/featherbittorrent-desktop-$VERSION-linux-aarch64.deb
          dist/featherbittorrent-desktop-$VERSION-linux-aarch64.deb.sha256
          dist/featherbittorrent-desktop-$VERSION-linux-aarch64.rpm
          dist/featherbittorrent-desktop-$VERSION-linux-aarch64.rpm.sha256
          dist/featherbittorrent-desktop-$VERSION-linux-aarch64.tar.gz
          dist/featherbittorrent-desktop-$VERSION-linux-aarch64.tar.gz.sha256
          EOF
          missing=0
          while read -r file; do
            if [ ! -s "$file" ]; then
              echo "::error::missing or empty: $file"
              missing=1
            fi
          done < "$RUNNER_TEMP/release-files"
          # The expected count comes from the build matrix, not from a remembered number: 2 Linux
          # archs x 2 variants x 6 files each (deb, rpm, tar.gz + one .sha256 each), plus 2 macOS
          # variants x 2 files each (tar.gz + .sha256), plus 2 Windows variants x 4 files each
          # (two zips per variant: x86_64 and arm64, each with its .sha256), plus 1 SBOM, plus the
          # desktop app: 1 macOS .dmg and 1 Windows .msi with their .sha256 (2 x 2), and 2 Linux archs
          # x 6 files each (deb, rpm, tar.gz + one .sha256 each).
          # The heredoc above must list exactly that many lines, and dist/ must hold exactly that
          # many files; a line added or dropped in either place is caught here.
          expected=$(( 2 * 2 * 6 + 2 * 2 + 2 * 4 + 1 + 2 * 2 + 2 * 6 ))
          listed="$(wc -l < "$RUNNER_TEMP/release-files")"
          echo "release file list holds $listed files, expected $expected"
          [ "$listed" -eq "$expected" ]
          present="$(find dist -maxdepth 1 -type f | wc -l)"
          echo "dist/ holds $present files, expected $expected"
          [ "$present" -eq "$expected" ]
          # Any file in dist/ that is not in the heredoc is a stray: name it and fail, so a script
          # that writes a new artifact without updating the list is caught here rather than at the
          # upload step.
          strays=0
          while read -r f; do
            if ! grep -qxF "$f" "$RUNNER_TEMP/release-files"; then
              echo "::error::in dist/ but not in the release list: $f"
              strays=1
            fi
          done < <(cd dist && find . -maxdepth 1 -type f | sed "s|^\./|dist/|" | sort)
          [ "$strays" -eq 0 ] || exit 1
          exit "$missing"
      - name: Remove a draft a failed run left
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GH_REPO/releases" \
            --jq '.[] | select(.draft and .tag_name == env.TAG) | .id' |
            while read -r id; do
              echo "deleting the draft release $id for $TAG"
              gh api -X DELETE "repos/$GH_REPO/releases/$id"
            done
      - name: Create the release as a draft
        run: |
          set -euo pipefail
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$TAG" --draft --verify-tag --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" --generate-notes "${prerelease[@]}"
      - name: Upload the files
        run: |
          set -euo pipefail
          mapfile -t files < "$RUNNER_TEMP/release-files"
          gh release upload "$TAG" "${files[@]}"
      - name: Publish the release
        run: gh release edit "$TAG" --draft=false
