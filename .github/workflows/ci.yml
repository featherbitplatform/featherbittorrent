name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Clippy
        # `--all-features` so the gated code is compiled too: `fbtt-core`'s local
        # backend test target requires its `test-support` feature, and an unrun test
        # is a test nobody noticed.
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace --all-features

  docs:
    name: docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps

  # No MSRV job: rust-toolchain.toml pins stable, and that file overrides a job
  # that installs an older toolchain. Cargo enforces workspace.rust-version at
  # build time, which is the same guarantee.

  # cargo-deny runs in security.yml (job cargo-deny), which also re-scans weekly.
