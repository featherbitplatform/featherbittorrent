[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
# Bumped on the release/X.Y.Z branch; main holds the annotated vX.Y.Z tag.
version = "0.2.3"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/featherbitplatform/featherbittorrent"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = "warn"

# Every dependency is declared here and inherited with `dep.workspace = true`;
# crates never pin their own versions, and each crate names the features it
# uses. Later tasks add what they need: ratatui and crossterm arrive with the
# views (Task 5). fbt (git, tag v0.9.0) arrived with the config, whose settings
# map onto `fbt::Settings`; tokio with the backend task (Task 4).
[workspace.dependencies]
# The workspace's own crates, so a member depends on another the same way it depends on
# anything else. A crate joins this table when another one starts using it: `fbtt-tui`
# arrives with the binary (Task 7), which is what makes it a dependency of something.
fbtt-core = { path = "crates/fbtt-core" }
fbtt-tui = { path = "crates/fbtt-tui" }
# Joins the table now that the binary depends on it for `serve`.
fbtt-server = { path = "crates/fbtt-server" }
# Joins the table now that the server's media routes read a file through it.
fbtt-media = { path = "crates/fbtt-media" }
clap = { version = "4.6", features = ["derive"] }
# The man pages and shell completions the packages install, written by the hidden `generate-assets`
# subcommand from the same `Command` that prints `--help`, so they cannot drift from the flags.
# Both ask for clap `^4.6.6`, the workspace's 4.6 line, so the tree keeps one `clap` and one
# `clap_builder` (`cargo tree -d` shows no duplicate).
clap_complete = "4"
clap_mangen = "0.3"
# The TUI stack. crossterm is the version ratatui's own backend uses (its default),
# so `ratatui::crossterm` and our `crossterm` are one crate, not two: two versions in
# one tree means a `KeyEvent` that does not match the terminal driving it.
# `event-stream` is for the binary's async event loop (Task 7).
crossterm = { version = "0.29", features = ["event-stream"] }
ratatui = { version = "0.30", default-features = false, features = [
    "crossterm",
    "std",
    # A layout cache so a table redraw does not re-solve the same column widths.
    "layout-cache",
] }
directories = "6"
fbt = { git = "https://github.com/featherbitplatform/fbt-lib", tag = "v0.11.1", features = ["serde"] }
# The control API the server serves, on the same tag as the engine it drives: the two come from one
# repository and one release, so they move together or not at all.
fbt-api = { git = "https://github.com/featherbitplatform/fbt-lib", tag = "v0.11.1" }
# The `Stream` trait only: `std::stream::Stream` is still unstable, and this is the
# same futures tree crossterm's `EventStream` implements it from. Already in the tree
# through crossterm's own event-stream feature, so this adds no versions to Cargo.lock.
futures-core = { version = "0.3", default-features = false, features = ["std"] }
# The test that proves the relay's bound needs nine requests in flight at once:
# `futures::join_all` is the one combinator that names a list rather than nine names.
futures = { version = "0.3", default-features = false, features = ["std"] }
# The relay's body stream: `StreamExt` to map a response's chunks into an axum body.
futures-util = { version = "0.3", default-features = false }
serde = { version = "1", default-features = false, features = ["std", "derive"] }
# serde_yaml is unmaintained (RUSTSEC-2024-0340); this is its maintained fork.
serde_norway = "0.9"
thiserror = "2"
# No default features: every crate names the parts it needs, so nothing pulls a
# runtime flavour nobody asked for. `macros` is for the macros a crate's own code uses
# (`select!` in the backend task) and for `#[tokio::test]`, which arrives in
# dev-dependencies too.
tokio = { version = "1", default-features = false }

# The server's login stack (Task 2): Argon2id password hashes, Ed25519 device keys and `sshsig`
# login signatures, session tokens and challenge nonces, and the base64 they are spelled in.
argon2 = "0.6"
base64 = "0.23"
getrandom = { version = "0.4", features = ["sys_rng"] }
sha2 = "0.11"
# Device keys: the OpenSSH public key line and `sshsig`. No default features: ed25519 is what a
# featherbittorrent server takes for a device login, and `ecdsa` (which pulls `sec1`) is turned on only by
# `fbtt-core`, for the P-256 keys a gateway's `private_key_jwt` assertion is signed with - see that crate's
# manifest. RSA stays off everywhere: it pulls the `rsa` crate, which carries an open advisory.
# `encryption` is what reads a passphrase-protected key file, `rand_core` is what makes
# `PrivateKey::random` available to tests.
ssh-key = { version = "0.7.0-rc.11", default-features = false, features = [
    "ed25519",
    "encryption",
    "std",
    "rand_core",
] }
# The `Signer` trait, so a device key can sign a gateway assertion over raw bytes. ssh-key implements
# it for `PrivateKey` but re-exports only `Signature` and `SigningKey`, and a supertrait's methods are
# not in scope just because the trait that names them is - so the trait is depended on directly, at the
# version ssh-key 0.7 uses, which is what makes it the same trait the impl is written for.
signature = { version = "3", default-features = false }
# A dev-dependency only, and only to check one thing: an ES256 assertion the way a gateway checks it, as
# fixed-width `r || s` against a P-256 key. ssh-key cannot be the check for that because it spells the same
# signature as two SSH mpints - which is what this client sends, so a test needs the other spelling to prove
# the conversion. The version is the one ssh-key's `p256` feature asks for, so the two are one crate in the
# tree; `ecdsa` is the feature that names `Signature` and `VerifyingKey`, and nothing else is needed.
p256 = { version = "0.14", default-features = false, features = ["ecdsa"] }
# Only for the `http` types an `AuthRequest` carries (the method and the headers), which fbt-api
# does not re-export. Depending on axum itself - not on `http` - is what keeps ours one crate with
# the `HeaderMap` fbt-api hands us. fbt-api turns the serving features on for the tree.
axum = { version = "0.8", default-features = false }
# The server's own routes: JSON bodies, and the error body in fbt-api's shape. Already in the tree
# through axum's own `json` feature, so this adds no versions to Cargo.lock.
serde_json = "1"
# The server's log lines (logins, state-file problems, what it listens on). No subscriber here: the
# binary decides where logs go and turns `tracing-subscriber` on for the run.
tracing = "0.1"
# The HTTP client: the tests' first, and from Task 6 the remote backend's. No default features -
# `default-tls` would pull a system TLS stack next to the one fbt already builds. Whoever needs https
# names rustls with the `ring` provider, which is what `fbt`'s own `tls` feature turns on, so no
# second crypto provider joins the tree; these tests speak plain http to loopback and ask for none.
reqwest = { version = "0.12", default-features = false }
# The URL parser, which the connect screen decides its encryption warning with: `Url::host()` is what says
# whether a password typed into an address would cross a network it cannot encrypt. reqwest parses the URLs
# it dials with this same crate, so the warning and the connection read `http://evil.example\@localhost/`
# the same way - which is the only reading the warning is worth having. Already in the tree through
# reqwest, on the version that resolves here (2.5.8), so this adds no versions to Cargo.lock.
url = "2.5"
# The remote backend signs logins with a device key held by ssh-agent as well as in a file, so it
# speaks the agent protocol rather than reimplementing it. Its `agent` feature is what turns on the
# tokio client; without it only the blocking one exists, and the backend's task must not block.
ssh-agent-lib = { version = "0.6", default-features = false }
# What the remote backend holds a password or a key passphrase in while it is in memory: `Zeroizing`
# overwrites the bytes when they are dropped. Already in the tree through rustls and ssh-key.
zeroize = "1"
# The binary's log lines for `serve`, which logs to stderr: `fmt` for the lines themselves,
# `env-filter` so `RUST_LOG` is honoured. No default features: `ansi` is off because the binary
# decides itself whether stderr takes colours, and `tracing-log` would bridge a `log` crate that
# nothing in this workspace logs through.
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt"] }
# The wizard's and `user set`'s password prompt: one line read with echo off, so a password typed at
# a terminal never lands in the shell's history or in what the run prints. It has no features to name.
rpassword = "7"
# Where a connect password lives between runs: the system keychain. `v1` is the feature that hands each
# platform its own store - the Apple keychain on macOS, the credential manager on Windows, the secret
# service on Linux - and nothing else: no default features are turned on beyond naming it. The Linux
# half is `zbus-secret-service-keyring-store`, which speaks D-Bus in Rust (zbus) and encrypts in Rust
# (`crypto-rust`, which keyring itself asks for), so no system D-Bus or OpenSSL library is needed to
# build it. The macOS half links the Security framework the platform already provides.
keyring = { version = "4.2", default-features = false, features = ["v1"] }
# The logo (milestone 3): `png` decodes the shipped mark and encodes the image an iTerm2 inline
# payload carries, `color_quant` picks the 256-colour palette a sixel stream is allowed. Neither
# is default-features-off because neither has features to name: what they do is decode and encode.
png = "0.18"
color_quant = "2"
# The logo probe (Task 8): `poll` and `read` on stdin, which a buffered `std::io::stdin()` would keep for
# itself. Already in the tree through crossterm 0.29, which resolves to rustix 1.1.6 - named at that exact
# version so this adds no versions to Cargo.lock. Unix only: see the binary's
# `[target.'cfg(unix)'.dependencies]`.
rustix = "1.1.6"
# The logo probe on Windows (the fix for the Windows skip): the console's input events are where a
# Windows terminal's replies to the queries arrive, one key event per character. Already in the
# tree through crossterm 0.29, which resolves to crossterm_winapi 0.9.1 - named at that exact version
# so this adds no versions to Cargo.lock. Windows only: see the binary's
# `[target.'cfg(windows)'.dependencies]`.
crossterm_winapi = "0.9.1"
# The web UI (plan 2026-11-21-web-ui-milestone-1): `rust-embed` carries the built `web/dist` into
# the server binary behind the `fbtt-server` `web-ui` feature, `mime_guess` names the type of each
# asset it hands out, and `subtle` compares the browser session's CSRF token in constant time.
# Declared now and joined by crates from the web UI tasks that use them (subtle from Task 2, the
# other two from Task 4); until a crate names one it is a workspace entry with nothing depending on
# it, which is in no build and in no Cargo.lock.
#
# `rust-embed`'s defaults are turned off here rather than in the member that uses it, which is how
# this file spells every other dependency whose default features are not wanted (`reqwest` above).
# The feature that matters is `debug-embed`, and it is not asked for: `rust-embed` 8.14 declares no
# `default` key in its `[features]` at all, so this changes nothing about what resolves today and
# says out loud which side of its `cfg(debug_assertions)` pair we want. With `debug-embed` off, the
# derive keeps the embedded bytes behind `cfg(not(debug_assertions))` and compiles a disk-reading
# implementation behind `cfg(debug_assertions)`; `crates/fbtt-server/src/web.rs`'s module doc says
# what that means for a debug run and a shipped one.
rust-embed = { version = "8.14", default-features = false }
mime_guess = "2.0"
subtle = "2.6"
# The media player (plan 2026-11-21-web-ui-milestone-2-media-player): `matroska-demuxer` reads Matroska
# and WebM (Zlib OR MIT OR Apache-2.0, and `#![forbid(unsafe_code)]` like every crate here), `mp4-atom`
# is the box codec `fbtt-media` reads MP4 with and writes its fragmented MP4 with (MIT OR Apache-2.0).
# Neither decodes nor transcodes anything: both are container codecs, which is what "no native
# libraries" (plan Global Constraints) asks for. The `matroska-demuxer` pin is the owner's fork,
# which fixes seeking with `CueRelativePosition` and adds overflow checks on hostile cue, block
# and timestamp values.
matroska-demuxer = { git = "https://github.com/featherbitplatform/matroska-demuxer", tag = "v0.8.1+featherbit.1" }
mp4-atom = "0.17.1"
